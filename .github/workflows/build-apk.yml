
name: Build FaceSwapPro APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'FaceSwapPro_GitHub*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/FaceSwapPro/app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: extracted/FaceSwapPro

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapPro-APK
          path: extracted/FaceSwapPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
