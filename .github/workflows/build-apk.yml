
name: Build FaceSwapPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'FaceSwapPro_GitHub*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          if [ ! -f extracted/FaceSwapPro/app/build.gradle.kts ]; then
            echo "ERROR: Android project files not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Fix Kotlin DSL URI import
        shell: bash
        run: |
          set -e

          FILE="extracted/FaceSwapPro/app/build.gradle.kts"

          sed -i 's/java\.net\.URI(url)/URI(url)/g' "$FILE"

          if ! grep -q '^import java\.net\.URI$' "$FILE"; then
            sed -i '1i import java.net.URI' "$FILE"
          fi

      - name: Build debug APK
        working-directory: extracted/FaceSwapPro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapPro-APK
          path: extracted/FaceSwapPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: FaceSwapPro APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: extracted/FaceSwapPro/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          make_latest: false
